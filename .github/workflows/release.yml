name: release

# 推 v1.1.0 這種 tag 就發佈 npm 套件 cornhsu-ramp-scan。
# （擴充套件本身走 Chrome Web Store，不在此流程；此流程只發 CLI 的 npm 套件。）
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read # 發佈前查該 commit 的 CI check-runs
      id-token: write # npm 信任發布（OIDC）：GitHub 簽發 token，npm 換短效金鑰並自動簽 provenance
    steps:
      - uses: actions/checkout@v5

      # 對任意 commit 打 tag 都能走到這裡，但 prepublishOnly 不含 e2e（需 Chrome＋xvfb）。
      # 發佈前要求該 commit 的 CI（quality＋e2e，即 ci.yml 的 job id）已經綠燈，否則 npm
      # 套件的實際掃描路徑只靠「人記得先看 CI」守。
      # 常見的 `git push --follow-tags` 會讓 main 與 tag 同時推上來——CI 還在跑，所以這裡
      # 輪詢等待（上限 30 分鐘）而不是立刻失敗。紅燈、被取消（ci.yml 有 cancel-in-progress，
      # 連推兩個 commit 時舊的會被取消）、或等到逾時仍沒跑（不在 main 的 commit CI 不會跑）
      # 都明講原因並失敗。
      - name: 確認該 commit 的 CI 已綠燈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # annotated tag 時 GITHUB_SHA 不保證是 commit；以 checkout 結果取出 commit SHA
          SHA=$(git rev-parse 'HEAD^{commit}')
          for NAME in quality e2e; do
            for i in $(seq 1 60); do
              STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${NAME}" \
                --jq '.check_runs[0] | if . == null then "missing" elif .status != "completed" then "pending" else .conclusion end')
              [ "$STATE" = "pending" ] || [ "$STATE" = "missing" ] || break
              echo "check-run ${NAME}: ${STATE}，30 秒後再查（${i}/60）"
              sleep 30
            done
            echo "check-run ${NAME}: ${STATE}"
            if [ "$STATE" != "success" ]; then
              echo "::error::commit ${SHA} 的 CI job「${NAME}」不是 success（${STATE}）。請先讓 CI 在這個 commit 上綠燈（cancelled 就重跑 CI），再重跑本 workflow。"
              exit 1
            fi
          done

      # 刻意不設 registry-url：它會在 .npmrc 寫 `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`，
      # 而 OIDC 情境下該變數不存在 → npm 拿空 token 驗證而不改走 OIDC，直接發布失敗
      # （actions/setup-node#1551）。預設 registry 本就是 npmjs.org，不需要設。
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # 信任發布需要 npm CLI >= 11.5.1；Node 22 內建的是 10.x
      - name: Upgrade npm (trusted publishing 需要 >= 11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - name: 確認 tag 版本與 package.json 一致
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VER package.json=$PKG_VER"
          if [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "::error::tag ($TAG_VER) 與 package.json ($PKG_VER) 版本不一致，請先同步再重打 tag"
            exit 1
          fi

      # 認證只走 npm 信任發布（OIDC）：GitHub 簽發 OIDC token，npm 換短效金鑰並自動簽
      # provenance，沒有任何長效金鑰（同 PolyMigrate／Parity）。
      # 1.1.0 首發用的 NPM_TOKEN 分支已經拿掉：它「有 secret 就優先用」，首發後 secret 忘了刪，
      # 信任發布就從來沒被用過（npmjs.com 上的設定還因此過期），直到 2026-10 npm 收緊「可繞過
      # 2FA 的 token」才在 v2.0.0 發佈時 404 爆出來。
      # 所以下面先守門：環境或 .npmrc 裡出現 npm token 就直接失敗，不讓 npm 拿它去認證。
      # 仍然成立：不要設 NODE_AUTH_TOKEN（也不要讓 setup-node 寫 registry-url）——那個變數
      # 設成空字串會讓 npm 拿空 token 去驗證而不改走 OIDC（actions/setup-node#1551）。
      # 信任發布的設定在 npmjs.com → 套件 → Settings → Trusted Publisher
      #（GitHub Actions：HSU-YU-MING／ramp-a11y／release.yml，environment 留空）。
      - name: Publish to npm
        run: |
          set -euo pipefail
          # 只看有沒有，不印出內容
          for v in $(compgen -e); do
            case "${v,,}" in
              npm_token|node_auth_token|npm_config_*auth*)
                echo "::error::環境變數 $v 看起來是 npm token；本套件只走 OIDC 信任發布，請拿掉它"
                exit 1 ;;
            esac
          done
          for f in ~/.npmrc .npmrc "${NPM_CONFIG_USERCONFIG:-}"; do
            if grep -qs '_auth' "$f"; then
              echo "::error::$f 裡有 npm 認證設定（_auth／_authToken）；本套件只走 OIDC 信任發布，請拿掉它"
              exit 1
            fi
          done
          echo "認證：OIDC 信任發布"
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          # 冪等：版本已存在就跳過而不報錯（重跑 workflow 不會被擋）
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "↷ $NAME@$VER 已存在，跳過發布"
            exit 0
          fi
          # npm publish 會先跑 prepublishOnly 閘門（lint + unit + self + cli + docs）
          npm publish --access public
